<div class="w-full max-w-6xl mx-auto flex flex-col items-center gap-6 px-2 sm:px-4">
  @if (!conversationStarted()) {
    <!-- Accroche centrale type ChatGPT / Gemini -->
    <div class="text-center space-y-2">
      <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
        Comment la Mairie d'Asnières peut-elle vous aider ?
      </h2>
      <p class="text-sm text-slate-500">
        Posez votre question en langage naturel (démarches, pièces à fournir, horaires...).
      </p>
    </div>

    <!-- Encarts de suggestions rapides -->
    <div class="w-full grid grid-cols-1 sm:grid-cols-2 gap-4 pt-1">
      @for (item of suggestions; track item.title) {
        <button
          type="button"
          (click)="selectSuggestion(item.prompt)"
          class="group text-left p-5 rounded-xl border border-slate-200 bg-white hover:border-blue-500 hover:bg-blue-50/40 hover:shadow-sm transition-all duration-150 cursor-pointer flex items-start gap-4">
          
          <!-- Icône de l'encart -->
          <span class="p-2.5 rounded-lg bg-slate-100 text-slate-600 group-hover:bg-blue-600 group-hover:text-white transition-colors duration-150 shrink-0">
            @switch (item.icon) {
              @case ('id') {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"/>
                </svg>
              }
              @case ('school') {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
                </svg>
              }
              @case ('clock') {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
              }
              @default {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
              }
            }
          </span>

          <!-- Libellés -->
          <div class="flex flex-col min-w-0">
            <span class="text-sm font-semibold text-slate-800 group-hover:text-blue-700 transition-colors">
              {{ item.title }}
            </span>
            <span class="text-xs text-slate-400 font-normal">
              {{ item.subtitle }}
            </span>
          </div>
        </button>
      }
    </div>
  }

  <!-- Boîte de saisie -->
  <div class="w-full relative bg-white border border-slate-300 rounded-2xl shadow-sm focus-within:border-blue-600 focus-within:ring-2 focus-within:ring-blue-100 transition-all">
    <textarea
      [value]="prompt()"
      (input)="onInput($event)"
      (keydown)="onKeyDown($event)"
      rows="2"
      placeholder="Ex : Je souhaite refaire ma carte d'identité, quels documents apporter ?"
      class="w-full resize-none p-4 pr-24 bg-transparent text-slate-800 placeholder:text-slate-400 focus:outline-none rounded-2xl text-sm sm:text-base">
    </textarea>

    <!-- Boutons d'action (Micro pour borne tactile + Envoyer) -->
    <div class="absolute right-3 bottom-3 flex items-center gap-2">
      <!-- Micro (Speech-to-Text pour l'accessibilité borne) -->
      <button 
        type="button" 
        class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl transition cursor-pointer"
        title="Saisie vocale">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
        </svg>
      </button>

      <!-- Bouton Envoyer -->
      <button 
        type="button" 
        (click)="send()"
        [disabled]="!prompt().trim()"
        class="p-2 bg-blue-700 disabled:bg-slate-200 text-white disabled:text-slate-400 rounded-xl transition cursor-pointer disabled:cursor-not-allowed">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Note de souveraineté sous le champ -->
  <p class="text-[11px] text-slate-400">
    Données hébergées localement &bull; Conforme RGPD &bull; Traitement via RAG souverain
  </p>
</div>
